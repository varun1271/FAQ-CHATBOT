<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeGPT - Your Personal AI Coding Assistant</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <!-- Markdown & Highlight -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="dark-theme">
  <div id="toast-container"></div>

  <nav class="navbar">
    <div class="logo">CodeGPT</div>
    <div class="nav-actions">
      <button id="themeToggle" class="icon-btn" title="Toggle Theme">
        <i class="fas fa-sun"></i>
      </button>
      <button id="historyBtn" class="icon-btn" title="Search History">
        <i class="fas fa-history"></i>
      </button>
    </div>
  </nav>

  <main class="container" id="landingPage">
    <header class="hero">
      <h1 class="logo-large">CodeGPT</h1>
      <p class="tagline">Your Personal AI Coding Assistant</p>
    </header>

    <div class="feature-grid">
      <!-- Learn Coding Card -->
      <section class="card glass" id="learnCard">
        <div class="card-icon"><i class="fas fa-graduation-cap"></i></div>
        <h2>Learn Coding</h2>
        <p>Learn any programming topic instantly.</p>
        <div class="search-box-container">
          <div class="input-group glass">
            <input type="text" id="learnInput" placeholder="/loops, /python, /functions..." autocomplete="off">
            <button id="learnSubmit"><i class="fas fa-arrow-right"></i></button>
          </div>
          <div id="autocompleteSuggestions" class="suggestions-box hidden"></div>
        </div>
        <p class="hint">Use "/" to start. Example: <code>/python</code></p>
      </section>

      <!-- Fix My Code Card -->
      <section class="card glass" id="fixCard">
        <div class="card-icon"><i class="fas fa-bug"></i></div>
        <h2>Fix My Code</h2>
        <div class="fix-container">
          <select id="fixLanguage" class="glass">
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="c">C</option>
            <option value="cpp">C++</option>
          </select>
          <textarea id="fixCodeInput" placeholder="Paste your code here..." class="glass"></textarea>
          <button id="fixSubmit" class="btn-primary">Fix Code</button>
        </div>
      </section>
    </div>
  </main>

  <!-- Response Section -->
  <section id="responsePage" class="container hidden">
    <button id="backBtn" class="btn-text"><i class="fas fa-chevron-left"></i> Back to Tools</button>
    <div id="responseContent" class="glass-heavy">
      <!-- AI response will be injected here -->
    </div>
    <div class="response-actions">
      <button id="copyAllBtn" class="btn-secondary"><i class="far fa-copy"></i> Copy All</button>
      <button id="downloadBtn" class="btn-secondary"><i class="fas fa-download"></i> Download</button>
    </div>
  </section>

  <!-- History Sidebar/Modal -->
  <div id="historyModal" class="modal hidden">
    <div class="modal-content glass">
      <div class="modal-header">
        <h3>Recent Activity</h3>
        <button id="closeHistory" class="icon-btn"><i class="fas fa-times"></i></button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- Loading Animation -->
  <div id="loadingOverlay" class="hidden">
    <div class="spinner"></div>
    <p>CodeGPT is thinking...</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
