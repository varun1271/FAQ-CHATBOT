<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeGPT - Specialized Coding Assistant</title>
  <link rel="stylesheet" href="style.css">
  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <button class="new-chat-btn" id="newChatBtn">
        <i class="fas fa-plus"></i> New Chat
      </button>
      <div class="chat-history">
        <p class="history-label">Recent</p>
        <ul id="historyList">
          <li class="history-item active"><i class="far fa-message"></i> Python Loop Help</li>
        </ul>
      </div>
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="avatar-small">U</div>
          <span>User Name</span>
        </div>
      </div>
    </aside>

    <main class="chat-main">
      <header class="top-bar">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <div class="model-info">CodeGPT 4.0 <i class="fas fa-chevron-down"></i></div>
        <div class="top-actions">
          <i class="far fa-share-from-square"></i>
        </div>
      </header>

      <section id="chatBox" class="chat-box">
        <article class="message-row assistant-row">
          <div class="avatar"><i class="fas fa-robot"></i></div>
          <div class="message assistant">
            Hello! I'm CodeGPT, your specialized assistant for **Python**, **Java**, **C**, and **C++**. How can I help you code today?
          </div>
        </article>
      </section>

      <div class="input-container">
        <form id="chatForm" class="input-panel">
          <textarea
            id="userInput"
            placeholder="Message CodeGPT..."
            rows="1"
            autocomplete="off"
          ></textarea>
          <button type="submit" id="sendButton" disabled>
            <i class="fas fa-arrow-up"></i>
          </button>
        </form>
        <p class="disclaimer">CodeGPT can make mistakes. Check important info.</p>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
